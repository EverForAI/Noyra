name: noyra

services:
  noyra:
    build:
      context: .
      args:
        NOYRA_INSTALL_PROFILE: ${NOYRA_INSTALL_PROFILE:-base}
    # Retry transient crashes a bounded number of times.  The service exits
    # with EX_CONFIG (78) for invalid configuration, so a bad deployment does
    # not restart forever and hide the operator error.
    restart: on-failure:5
    env_file:
      - .env
    environment:
      NOYRA_DATA_DIR: /var/lib/noyra
      NOYRA_AT_REST_MODE: required
      NOYRA_VOLUME_ENCRYPTION_BACKEND: attestation
      NOYRA_VOLUME_ATTESTATION_PATH: /run/noyra/volume-attestation.json
      NOYRA_BACKUP_KEYRING_PATH: /run/secrets/noyra-backup-keyring.json
      NOYRA_HOST: 0.0.0.0
      # The port is published on host loopback only; this opt-in applies to the
      # container-side listener, not a public plaintext socket.
      NOYRA_ALLOW_INSECURE_NON_LOOPBACK: "true"
      NOYRA_PORT: 8765
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - noyra-data:/var/lib/noyra
      - ${NOYRA_BACKUP_KEYRING_HOST_PATH:-./.runtime/at-rest/backup-keyring.json}:/run/secrets/noyra-backup-keyring.json:ro
      - ${NOYRA_VOLUME_ATTESTATION_HOST_PATH:-./.runtime/at-rest/volume-attestation.json}:/run/noyra/volume-attestation.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  noyra-data:
