components:
  securitySchemes:
    readBearer:
      type: http
      scheme: bearer
      description: NOYRA_READ_TOKEN (or a higher-privilege token)
    operatorBearer:
      type: http
      scheme: bearer
      description: NOYRA_OPERATOR_TOKEN (or break-glass/admin token)
    exportBearer:
      type: http
      scheme: bearer
      description: NOYRA_EXPORT_TOKEN (or break-glass/admin token)
  parameters:
    PublicArchiveLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PublicArchiveCursor:
      name: cursor
      in: query
      description: Cursor returned by the preceding page; bound to subject and filters.
      schema: { type: string, maxLength: 1500 }
    PublicArchiveSince:
      name: since
      in: query
      schema: { type: string, format: date-time, maxLength: 40 }
    PublicArchiveUntil:
      name: until
      in: query
      schema: { type: string, format: date-time, maxLength: 40 }
    PublicArchiveSearch:
      name: search
      in: query
      description: Search approved public text only.
      schema: { type: string, maxLength: 120 }
    PublicArchiveStatus:
      name: status
      in: query
      description: Empty means all statuses; otherwise exact approved public status text, including legacy custom values.
      schema: { type: string, maxLength: 500 }
    PublicArchiveId:
      name: id
      in: query
      description: Recheck current visibility and fetch the full public body in its matching category.
      schema: { type: string, minLength: 1, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, pattern: '^migration-target-[A-Za-z0-9_-]+$' }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, pattern: '^migration-proposal-[A-Za-z0-9_-]+$' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: '^migration-task-[A-Za-z0-9_-]+$' }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding runtime-log page.
      schema: { type: string, minLength: 1, maxLength: 8192 }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, pattern: '^export-job-[A-Za-z0-9_-]+$' }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    CallId:
      name: callId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ConfigId:
      name: configId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    PeerId:
      name: peerId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    PublicArchivePage:
      description: Public-contract-v2 bounded page; list bodies are empty, detail bodies are rechecked.
      headers:
        Cache-Control: { schema: { type: string, enum: [no-store] } }
        X-Noyra-Public-Contract: { schema: { type: string, enum: [public-contract-v2] } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicArchivePage' } } }
    PublicArchiveOverview:
      description: Public state metadata and small excerpts of explicitly public records.
      headers:
        Cache-Control: { schema: { type: string, enum: [no-store] } }
        X-Noyra-Public-Contract: { schema: { type: string, enum: [public-contract-v2] } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PublicArchiveOverview' } } }
    PublicArchiveTooLarge:
      description: public_response_too_large; response exceeds 2000000 UTF-8 bytes.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    JsonList:
      description: JSON list
      content: { application/json: { schema: { type: array, items: { type: object } } } }
    JsonObject:
      description: JSON object
      content: { application/json: { schema: { type: object, additionalProperties: true } } }
    Unauthorized:
      description: Missing or invalid role token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Request conflicts with durable state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated request is not permitted
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Bounded queue or rate limit exhausted
      headers:
        Retry-After: { description: Suggested wait in seconds., schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      $ref: '#/components/responses/TooManyRequests'
    LengthRequired:
      description: Content-Length is missing or invalid; error is length_required.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RequestEntityTooLarge:
      description: Request body exceeds the configured byte limit; error is too_large.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RequestTooLarge:
      $ref: '#/components/responses/RequestEntityTooLarge'
    NotImplemented:
      description: Provider does not support model discovery; error is model_discovery_unsupported.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: Runtime dependency is degraded
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadGateway:
      description: Upstream peer unavailable or invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: JSON request body is required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    PublicArchiveItem:
      type: object
      additionalProperties: false
      required: [id, kind, title, summary, body, status, details, occurred_at, updated_at, provenance]
      properties:
        id: { type: string }
        kind: { type: string, enum: [diary, behavior, interaction, post, lifecycle, goal, project, prediction, research, sleep, update] }
        title: { type: string }
        summary: { type: string }
        body: { type: string, description: Empty in lists; current approved body for an id query. }
        status: { type: string }
        details: { type: object, description: Approved category fields only; see public-contract-v2.md. }
        occurred_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        provenance: { type: string }
        revision: { type: integer, minimum: 1 }
    PublicArchivePage:
      type: object
      additionalProperties: false
      required: [contract, generated_at, items, next_cursor]
      properties:
        contract: { type: string, enum: [public-contract-v2] }
        generated_at: { type: string, format: date-time }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PublicArchiveItem' } }
        next_cursor: { type: string, nullable: true }
    PublicArchiveOverview:
      type: object
      additionalProperties: false
      required: [contract, generated_at, display_name, lifecycle, public_diary_count, last_sleep_completed_at, recent, goals, projects]
      properties:
        contract: { type: string, enum: [public-contract-v2] }
        generated_at: { type: string, format: date-time }
        display_name: { type: string }
        lifecycle:
          type: object
          additionalProperties: false
          required: [state, changed_at]
          properties:
            state: { type: string, enum: [booting, orienting, active, paused, winding_down, reflective_sleep, deep_sleep, waking, stopped, resetting] }
            changed_at: { type: string, format: date-time }
        public_diary_count: { type: integer, minimum: 0 }
        last_sleep_completed_at: { type: string, format: date-time, nullable: true }
        recent: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/PublicArchiveItem' } }
        writing:
          type: array
          maxItems: 1
          description: Optional latest public diary preview, using the same projection as the diary list with an empty body. Independent of recent timeline stage changes. Added October 23, 2026; clients may fall back to recent when absent.
          items: { $ref: '#/components/schemas/PublicArchiveItem' }
        goals: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/PublicArchiveItem' } }
        projects: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/PublicArchiveItem' } }
    PublicPublicationInput:
      type: object
      additionalProperties: false
      required: [publication_id, kind, title, summary, expected_revision, confirm_public]
      properties:
        publication_id: { type: string, pattern: '^[a-zA-Z0-9_-]{8,100}$' }
        kind: { type: string, enum: [goal, project, prediction, research, sleep, update] }
        source_id: { type: string, minLength: 1, maxLength: 256, nullable: true, description: Optional current-subject source; forbidden for updates; never returned anonymously. }
        title: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        body: { type: string, maxLength: 20000, default: '' }
        details: { type: object, description: Category-specific approved optional fields; see public-contract-v2.md. }
        expected_revision: { type: integer, minimum: 0 }
        confirm_public: { type: boolean, enum: [true] }
    RuntimeLogPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { type: object }
        next_cursor:
          type: string
          nullable: true
    WalletBalanceHistoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [snapshot_id, subject_id, network_id, asset_id, address_id, balance, source, observed_at, created_at]
            properties:
              snapshot_id: { type: string }
              subject_id: { type: string }
              network_id: { type: string }
              asset_id: { type: string }
              address_id: { type: string }
              balance: { type: string, pattern: '^(0|[1-9][0-9]{0,255})$' }
              source: { type: string }
              observed_at: { type: string, format: date-time }
              created_at: { type: string, format: date-time }
        next_cursor:
          type: string
          nullable: true
        has_more: { type: boolean }
    WalletObservationHealthBreakdown:
      type: object
      additionalProperties: false
      description: >-
        Bounded aggregate health grouped by network identifier or by the newest
        source for each active pair. A null source value denotes a pair with no
        observation. No balances, addresses, RPC origins, or lease credentials
        are returned.
      required: [group_by, evaluated_at, stale_after_seconds, status, groups, total_groups, has_more]
      properties:
        group_by: { type: string, enum: [network, source] }
        evaluated_at: { type: string, format: date-time }
        stale_after_seconds: { type: integer, minimum: 0, maximum: 2592000 }
        status: { type: string, enum: [ok, attention, degraded] }
        total_groups: { type: integer, minimum: 0, maximum: 256 }
        has_more: { type: boolean }
        groups:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/WalletObservationHealthGroup' }
    WalletObservationHealthGroup:
      type: object
      additionalProperties: false
      required:
        [value, active_pairs, observed_pairs, fresh_pairs, near_expiry_pairs,
         stale_pairs, never_pairs, future_pairs, anomalous_pairs, snapshot_count,
         latest_observed_at, max_age_seconds, status]
      properties:
        value: { type: string, nullable: true }
        active_pairs: { type: integer, minimum: 0 }
        observed_pairs: { type: integer, minimum: 0 }
        fresh_pairs: { type: integer, minimum: 0 }
        near_expiry_pairs: { type: integer, minimum: 0 }
        stale_pairs: { type: integer, minimum: 0 }
        never_pairs: { type: integer, minimum: 0 }
        future_pairs: { type: integer, minimum: 0 }
        anomalous_pairs: { type: integer, minimum: 0 }
        snapshot_count: { type: integer, minimum: 0 }
        latest_observed_at: { type: string, format: date-time, nullable: true }
        max_age_seconds: { type: integer, minimum: 0, nullable: true }
        status: { type: string, enum: [ok, attention, degraded] }
    WalletDiagnostics:
      description: Available aggregate projection or a bounded degraded result.
      oneOf:
        - $ref: '#/components/schemas/WalletDiagnosticsAvailable'
        - $ref: '#/components/schemas/WalletDiagnosticsUnavailable'
    WalletDiagnosticsAvailable:
      type: object
      additionalProperties: false
      required: [subject_id, status, resources, balance_history, acquisition]
      properties:
        subject_id: { type: string }
        status: { type: string, enum: [ok, attention, degraded] }
        resources:
          type: object
          additionalProperties: false
          required: [networks, assets, addresses]
          properties:
            networks: { $ref: '#/components/schemas/WalletResourceCounts' }
            assets: { $ref: '#/components/schemas/WalletResourceCounts' }
            addresses: { $ref: '#/components/schemas/WalletResourceCounts' }
        balance_history:
          type: object
          additionalProperties: false
          required: [snapshots, latest_observed_at, latest_created_at, observation_health]
          properties:
            snapshots: { type: integer, minimum: 0 }
            latest_observed_at: { type: string, format: date-time, nullable: true }
            latest_created_at: { type: string, format: date-time, nullable: true }
            observation_health:
              $ref: '#/components/schemas/WalletObservationHealth'
        acquisition:
          $ref: '#/components/schemas/WalletAcquisitionDiagnostics'
    WalletDiagnosticsUnavailable:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, const: degraded }
        reason: { type: string, const: unavailable }
    WalletResourceCounts:
      type: object
      additionalProperties: false
      required: [active, revoked, total]
      properties:
        active: { type: integer, minimum: 0 }
        revoked: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    WalletObservationHealth:
      type: object
      additionalProperties: false
      description: >-
        Constant-size health for active asset/address/network pairs. The
        evaluation timestamp and stale window are canonical UTC milliseconds
        and seconds respectively. A pair at exactly 75% of the window is
        near-expiry; a pair older than the window is stale. Future observations
        are counted separately. An anomaly is a same-time disagreement or an
        adjacent snapshot change greater than 100% (zero/non-zero always
        qualifies).
      required:
        [status, evaluated_at, stale_after_seconds, observed_pairs, fresh_pairs,
         near_expiry_pairs, stale_pairs, never_pairs, future_pairs, anomalous_pairs,
         max_age_seconds]
      properties:
        status: { type: string, enum: [ok, attention, degraded] }
        evaluated_at: { type: string, format: date-time }
        stale_after_seconds: { type: integer, minimum: 0, maximum: 2592000 }
        observed_pairs: { type: integer, minimum: 0 }
        fresh_pairs: { type: integer, minimum: 0 }
        near_expiry_pairs: { type: integer, minimum: 0 }
        stale_pairs: { type: integer, minimum: 0 }
        never_pairs: { type: integer, minimum: 0 }
        future_pairs: { type: integer, minimum: 0 }
        anomalous_pairs: { type: integer, minimum: 0 }
        max_age_seconds: { type: integer, minimum: 0, nullable: true }
    WalletAcquisitionDiagnostics:
      description: Available aggregate acquisition projection or a bounded degraded result.
      oneOf:
        - $ref: '#/components/schemas/WalletAcquisitionAvailable'
        - $ref: '#/components/schemas/WalletDiagnosticsUnavailable'
    WalletAcquisitionAvailable:
      type: object
      additionalProperties: false
      required:
        [subject_id, status, counts, total, active, attention, attempts,
         expired_running, next_attempt_at]
      properties:
        subject_id: { type: string }
        status: { type: string, enum: [ok, attention, degraded] }
        counts:
          type: object
          additionalProperties: false
          required: [cancelled, failed, queued, retry_wait, running, succeeded, unknown]
          properties:
            cancelled: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            queued: { type: integer, minimum: 0 }
            retry_wait: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            succeeded: { type: integer, minimum: 0 }
            unknown: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        attention: { type: integer, minimum: 0 }
        attempts: { type: integer, minimum: 0 }
        expired_running: { type: integer, minimum: 0 }
        next_attempt_at: { type: string, format: date-time, nullable: true }
    PublicSubjectStateV1:
      type: object
      additionalProperties: false
      required: [schema, schema_version, subject_id, display_name, lifecycle, online, public_diary_count]
      properties:
        schema: { type: string, const: PublicSubjectStateV1 }
        schema_version: { type: integer, const: 1 }
        subject_id: { type: string }
        display_name: { type: string }
        lifecycle:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string }
        online: { type: boolean }
        public_diary_count: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      required: [status, lifecycle, integrity, at_rest, cloud_archive]
      properties:
        status: { type: string, enum: [ok, degraded] }
        lifecycle: { type: object }
        loop: { type: object, nullable: true }
        integrity:
          type: object
          nullable: true
          description: Bounded operational summary; private check identifiers and evidence are omitted.
        at_rest:
          allOf: [{ $ref: '#/components/schemas/AtRestHealth' }]
          nullable: true
        cloud_archive: { type: object }
        wallet_acquisition:
          type: object
          description: Bounded wallet balance acquisition counters; no lease credentials are exposed.
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: noyra }
    Readiness:
      type: object
      additionalProperties: true
      required: [status, service]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, const: noyra }
    AtRestHealth:
      type: object
      required: [mode, enforced, ready, threat_model, permissions, volume, backup_key]
      properties:
        mode: { type: string, enum: [development, required] }
        enforced: { type: boolean }
        ready: { type: boolean }
        threat_model: { type: string, enum: [noyra-at-rest/offline-media-v1] }
        permissions: { type: object }
        volume: { type: object }
        backup_key:
          type: object
          description: Key IDs, fingerprints, and generations only; key bytes are never exposed.
        reason: { type: string }
    InteractionInput:
      type: object
      required: [content]
      properties:
        channel: { type: string, default: web }
        counterparty: { type: string, default: web-user }
        content: { type: string, maxLength: 100000 }
        idempotency_key: { type: string, maxLength: 256 }
    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 10000 }
    WalletAcquisitionInput:
      type: object
      additionalProperties: false
      required: [asset_id, address_id]
      properties:
        asset_id: { type: string, minLength: 1, maxLength: 128 }
        address_id: { type: string, minLength: 1, maxLength: 128 }
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        max_attempts: { type: integer, minimum: 1, maximum: 5, default: 5 }
        not_before: { type: string, format: date-time }
    WalletAcquisitionRunInput:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 32, default: 1 }
    WalletAcquisitionRetryInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
        not_before: { type: string, format: date-time }
    WalletExecutionReceiptRequest:
      type: object
      additionalProperties: false
    WalletExecutionRecoveryInput:
      type: object
      additionalProperties: false
      properties:
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    ReconciliationInput:
      type: object
      additionalProperties: true
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [succeeded, failed, cancelled] }
        reason: { type: string, minLength: 1, maxLength: 10000 }
        result: { type: object, additionalProperties: true }
        response: { type: object, additionalProperties: true, nullable: true }
    ModelCallReconciliationInput:
      type: object
      additionalProperties: false
      required: [reason]
      anyOf:
        - required: [outcome]
        - required: [status]
      properties:
        outcome: { type: string, enum: [succeeded, failed, retry] }
        status: { type: string, enum: [succeeded, failed, retry] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        response: { type: object, additionalProperties: true, nullable: true }
        evidence: { type: object, additionalProperties: true, nullable: true }
    DeliveryReconciliationInput:
      type: object
      additionalProperties: true
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 10000 }
        status: { type: string, enum: [delivered, failed, cancelled] }
        provider_message_id: { type: string, nullable: true }
