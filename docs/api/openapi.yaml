openapi: 3.0.3
info:
  title: Noyra Runtime API
  version: 0.1.0
  description: |
    Stable versioned control and observation API for one Noyra subject.
    The unversioned /api paths remain compatible aliases; new clients should
    use /api/v1. Authentication uses a role-specific bearer token. /health is
    a cached readiness projection; /health/live is a cheap liveness probe and
    /health/ready checks only startup admission dependencies.
  x-global-error-responses:
    api_routes:
      '429': Bounded rate limit or queue capacity was exhausted; honor Retry-After.
      '503': A shared runtime or at-rest dependency is unavailable; honor Retry-After.
    json_request_routes:
      '411': Content-Length is required for JSON requests.
      '413': The request body exceeds the configured byte limit.
servers:
  - url: http://127.0.0.1:8765
tags:
  - name: observation
  - name: configuration
  - name: exports
paths:
  /health:
    get:
      tags: [observation]
      operationId: health
      responses:
        '200':
          description: Healthy runtime
          content:
            application/json: { schema: { $ref: '#/components/schemas/Health' } }
        '503':
          description: Runtime is degraded
          content:
            application/json: { schema: { $ref: '#/components/schemas/Health' } }
  /health/live:
    get:
      tags: [observation]
      operationId: healthLive
      responses:
        '200':
          description: Process is accepting health probes
          content:
            application/json: { schema: { $ref: '#/components/schemas/Liveness' } }
  /health/ready:
    get:
      tags: [observation]
      operationId: healthReady
      responses:
        '200':
          description: Runtime is ready for normal requests
          content:
            application/json: { schema: { $ref: '#/components/schemas/Readiness' } }
        '503':
          description: Startup or runtime admission dependency is unavailable
          content:
            application/json: { schema: { $ref: '#/components/schemas/Readiness' } }
  /api/v1/state:
    get:
      tags: [observation]
      operationId: state
      responses:
        '200':
          description: Public state projection
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicSubjectStateV1' } } }
  /api/v1/state/details:
    get:
      tags: [observation]
      operationId: stateDetails
      security: [{ readBearer: [] }]
      responses:
        '200':
          description: Detailed operational state for authorized readers
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/diary:
    get:
      tags: [observation]
      operationId: diary
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/JsonList' } }
  /api/v1/behavior:
    get:
      tags: [observation]
      operationId: behavior
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/JsonList' } }
  /api/v1/goals:
    get:
      tags: [observation]
      operationId: goals
      security: [{ readBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/projects:
    get:
      tags: [observation]
      operationId: projects
      security: [{ readBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/outcomes:
    get:
      tags: [observation]
      operationId: outcomes
      security: [{ readBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/interactions:
    get:
      tags: [observation]
      operationId: interactions
      responses: { '200': { $ref: '#/components/responses/JsonList' } }
    post:
      tags: [configuration]
      operationId: offerInteraction
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/InteractionInput' } }
      responses:
        '201': { description: Interaction recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/v1/runtime-logs:
    get:
      tags: [observation]
      operationId: runtimeLogs
      security: [{ readBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Stable keyset page of runtime log records
          content:
            application/json: { schema: { $ref: '#/components/schemas/RuntimeLogPage' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/deliveries:
    get:
      tags: [observation]
      operationId: deliveries
      security: [{ readBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/deliveries/{deliveryId}/reconciliations:
    get:
      tags: [observation]
      operationId: deliveryReconciliationHistory
      security: [{ readBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/DeliveryId' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/export-jobs:
    get:
      tags: [exports]
      operationId: listExportJobs
      security: [{ exportBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [exports]
      operationId: createExportJob
      security: [{ exportBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [runtime, training] }
      responses:
        '202': { description: Export queued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Training export is disabled }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { description: Export queue is full }
  /api/v1/admin/export-jobs/{jobId}:
    get:
      tags: [exports]
      operationId: getExportJob
      security: [{ exportBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: Export job status }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/export-jobs/{jobId}/download:
    get:
      tags: [exports]
      operationId: downloadExportJob
      security: [{ exportBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: ZIP archive
          headers:
            X-Archive-SHA256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
          content: { application/zip: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Archive is not ready }
        '410': { description: Archive is no longer available }
  /api/v1/admin/export-jobs/{jobId}/cancel:
    post:
      tags: [exports]
      operationId: cancelExportJob
      security: [{ exportBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: Job cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Job is already running or terminal }
  /api/v1/diagnostics:
    get:
      tags: [observation]
      operationId: diagnostics
      security: [{ readBearer: [] }]
      responses:
        '200':
          description: Bounded operational diagnostics; wallet state is aggregate-only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  wallet: { $ref: '#/components/schemas/WalletDiagnostics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/health:
    get:
      tags: [observation]
      operationId: adminHealth
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/recoverable-work:
    get:
      tags: [observation]
      operationId: recoverableWork
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/lifecycle:
    get:
      tags: [observation]
      operationId: lifecycle
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/lifecycle/{operation}:
    post:
      tags: [configuration]
      operationId: lifecycleControl
      security: [{ operatorBearer: [] }]
      parameters:
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [pause, resume, reset] }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/v1/admin/actions/{actionId}/reconcile:
    post:
      tags: [configuration]
      operationId: reconcileAction
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ActionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationInput' } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/model-calls/{callId}/reconcile:
    post:
      tags: [configuration]
      operationId: reconcileModelCall
      security: [{ operatorBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelCallReconciliationInput' } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/runtime-export:
    get:
      tags: [exports]
      operationId: legacyRuntimeExport
      security: [{ exportBearer: [] }]
      responses:
        '202': { description: Compatibility route queued an export job }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/admin/training-export:
    get:
      tags: [exports]
      operationId: legacyTrainingExport
      security: [{ exportBearer: [] }]
      responses:
        '202': { description: Compatibility route queued an export job }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/common-knowledge/public-key:
    get:
      tags: [observation]
      operationId: commonKnowledgePublicKey
      responses: { '200': { $ref: '#/components/responses/JsonObject' } }
  /api/v1/common-knowledge/discovery:
    get:
      tags: [observation]
      operationId: commonKnowledgeDiscovery
      responses: { '200': { $ref: '#/components/responses/JsonObject' } }
  /api/v1/common-knowledge/feed:
    get:
      tags: [observation]
      operationId: commonKnowledgeFeed
      parameters:
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/common-knowledge/public:
    get:
      tags: [observation]
      operationId: commonKnowledgePublic
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/JsonList' } }
  /api/v1/mailbox:
    get:
      tags: [observation]
      operationId: mailbox
      security: [{ readBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/bounties:
    get:
      tags: [configuration]
      operationId: listPublicBounties
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/bounties/{bountyId}:
    get:
      tags: [configuration]
      operationId: getPublicBounty
      parameters: [{ name: bountyId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-bounties:
    get:
      tags: [configuration]
      operationId: listWalletBounties
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [configuration]
      operationId: createWalletBounty
      security: [{ operatorBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-submissions:
    get:
      tags: [configuration]
      operationId: listWalletSubmissions
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-orders:
    get:
      tags: [configuration]
      operationId: listWalletOrders
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-rewards:
    get:
      tags: [wallet-rewards]
      operationId: listWalletRewardWorkflows
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [wallet-rewards]
      operationId: createWalletRewardWorkflow
      security: [{ operatorBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '411': { $ref: '#/components/responses/LengthRequired' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-reward-incidents:
    get:
      tags: [wallet-rewards]
      operationId: listWalletRewardIncidents
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-reward-incidents/{incidentId}/resolve:
    post:
      tags: [wallet-rewards]
      operationId: resolveWalletRewardIncident
      security: [{ operatorBearer: [] }]
      parameters: [{ name: incidentId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '411': { $ref: '#/components/responses/LengthRequired' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-executions:
    get:
      tags: [wallet-execution]
      operationId: listWalletExecutions
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-executions/{executionId}:
    get:
      tags: [wallet-execution]
      operationId: getWalletExecution
      security: [{ operatorBearer: [] }]
      parameters: [{ name: executionId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-executions/{executionId}/attempts:
    get:
      tags: [wallet-execution]
      operationId: listWalletExecutionAttempts
      security: [{ operatorBearer: [] }]
      parameters: [{ name: executionId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-policy:
    get:
      tags: [configuration]
      operationId: getWalletPolicy
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [configuration]
      operationId: updateWalletPolicy
      security: [{ operatorBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-ledger:
    get:
      tags: [configuration]
      operationId: getWalletLedger
      security: [{ operatorBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/JsonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-bounties/{bountyId}/{operation}:
    post:
      tags: [configuration]
      operationId: walletBountyOperation
      security: [{ operatorBearer: [] }]
      parameters:
        - { name: bountyId, in: path, required: true, schema: { type: string } }
        - { name: operation, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/wallet-rewards/{workflowId}/{operation}:
    post:
      tags: [wallet-rewards]
      operationId: walletRewardOperation
      security: [{ operatorBearer: [] }]
