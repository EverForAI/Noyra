openapi: 3.0.3
info:
  title: Noyra Runtime API
  version: 0.1.0
  description: |
    Stable versioned control and observation API for one Noyra subject.
    The unversioned /api paths remain compatible aliases; new clients should
    use /api/v1. Authentication uses a role-specific bearer token. /health is
    a cached readiness projection; /health/live is a cheap liveness probe and
    /health/ready checks only startup admission dependencies.
  x-global-error-responses:
    api_routes:
      '429': Bounded rate limit or queue capacity was exhausted; honor Retry-After.
      '503': A shared runtime or at-rest dependency is unavailable; honor Retry-After.
    json_request_routes:
      '411': Content-Length is required for JSON requests.
      '413': The request body exceeds the configured byte limit.
servers:
  - url: http://127.0.0.1:8765
tags:
  - name: observation
  - name: configuration
  - name: exports
paths:
  /health:
    get:
      tags: [observation]
      operationId: health
      responses:
        '200':
          description: Healthy runtime
          content:
            application/json: { schema: { $ref: '#/components/schemas/Health' } }
        '503':
          description: Runtime is degraded
          content:
            application/json: { schema: { $ref: '#/components/schemas/Health' } }
  /health/live:
    get:
      tags: [observation]
      operationId: healthLive
      responses:
        '200':
          description: Process is accepting health probes
          content:
            application/json: { schema: { $ref: '#/components/schemas/Liveness' } }
  /health/ready:
    get:
      tags: [observation]
      operationId: healthReady
      responses:
        '200':
          description: Runtime is ready for normal requests
          content:
            application/json: { schema: { $ref: '#/components/schemas/Readiness' } }
        '503':
          description: Startup or runtime admission dependency is unavailable
          content:
            application/json: { schema: { $ref: '#/components/schemas/Readiness' } }
  /api/v1/public/overview:
    get:
      tags: [observation]
      operationId: publicArchiveOverview
      description: |
        Anonymous public-contract-v2 archive. The /api/public/overview alias is equivalent.
        Reads approved public fields only; no private source text, credentials or diagnostics.
      responses:
        '200': { $ref: '#/components/responses/PublicArchiveOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PublicArchiveTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/public/timeline:
    get:
      tags: [observation]
      operationId: publicArchiveTimeline
      description: |
        Anonymous public-contract-v2 archive. The /api/public/timeline alias is equivalent.
        Reads approved public fields only; no private source text, credentials or diagnostics.
      parameters:
        - { $ref: '#/components/parameters/PublicArchiveLimit' }
        - { $ref: '#/components/parameters/PublicArchiveCursor' }
        - { $ref: '#/components/parameters/PublicArchiveSince' }
        - { $ref: '#/components/parameters/PublicArchiveUntil' }
        - { $ref: '#/components/parameters/PublicArchiveSearch' }
        - { $ref: '#/components/parameters/PublicArchiveStatus' }
        - { $ref: '#/components/parameters/PublicArchiveId' }
        - name: kind
          in: query
          schema: { type: string, enum: [all, diary, behavior, interaction, post, lifecycle, goal, project, prediction, research, sleep, update], default: all }
      responses:
        '200': { $ref: '#/components/responses/PublicArchivePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PublicArchiveTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
