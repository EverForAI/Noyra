        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/public-publications:
    get:
      tags: [configuration]
      operationId: listPublicPublications
      security: [{ operatorBearer: [] }]
      description: |
        Operator-only approved summaries, including withdrawn entries and private source IDs.
        No query retains the legacy list capped at 100. Pagination requires view=management.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [management] } }
        - { name: id, in: query, description: Authenticated outcome reconciliation; use with view=management and without limit or cursor. Returns item or null., schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { $ref: '#/components/parameters/PublicArchiveCursor' }
      responses:
        '200':
          description: Legacy list or management page with items and next_cursor.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [item]
                    properties:
                      item: { type: object, nullable: true }
                  - { type: array, maxItems: 100, items: { type: object } }
                  - type: object
                    required: [items, next_cursor]
                    properties:
                      items: { type: array, maxItems: 50, items: { type: object } }
                      next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [configuration]
      operationId: publishPublicSummary
      security: [{ operatorBearer: [] }]
      description: |
        Explicitly approved independent summary; never copies or modifies private source text.
        Creation uses expected_revision=0; edits use the current revision. Identical retries
        do not append a revision. Source/kind changes and stale revisions are rejected.
        Cookie sessions require the existing X-CSRF-Token. Withdrawal cannot erase visitor copies.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicPublicationInput' } } }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '411': { description: Content-Length is required }
        '413': { description: Request body exceeds the configured byte limit }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/public-publications/{publicationId}/withdraw:
    post:
      tags: [configuration]
      operationId: withdrawPublicSummary
      security: [{ operatorBearer: [] }]
      description: |
        Stops anonymous reading of the independent summary, retaining private originals and
        immutable revision metadata. Requires current revision; identical withdrawal is idempotent.
        Cookie sessions require the existing X-CSRF-Token.
      parameters:
        - { name: publicationId, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '411': { description: Content-Length is required }
        '413': { description: Request body exceeds the configured byte limit }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
