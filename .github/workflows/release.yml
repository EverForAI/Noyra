name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ".[dev]"
      - name: Run same-SHA wallet targeted smoke gate
        run: python scripts/audit-wallet-stage4b4.py --scope targeted --profile smoke
      - name: Run same-SHA wallet targeted pressure gate
        run: python scripts/audit-wallet-stage4b4.py --scope targeted --profile pressure
      - name: Run same-SHA wallet full gate
        run: python scripts/audit-wallet-stage4b4.py --scope full --profile soak
      - name: Preserve wallet gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wallet-gate-evidence-${{ github.sha }}
          path: artifacts/release/stage4b4/${{ github.sha }}/
          if-no-files-found: error

  release:
    needs: quality-gate
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked build and audit tools
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Download and verify same-SHA gate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wallet-gate-evidence-${{ github.sha }}
          path: artifacts/release/stage4b4/${{ github.sha }}
      - name: Reject stale or failed gate evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          root = Path("artifacts/release/stage4b4") / os.environ["EXPECTED_SHA"]
          runs = sorted(root.glob("*/run.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not runs:
              raise SystemExit("wallet gate evidence is missing")
          record = json.loads(runs[0].read_text(encoding="utf-8"))
          if record.get("commit_sha") != os.environ["EXPECTED_SHA"] or record.get("status") != "passed":
              raise SystemExit("wallet gate evidence is stale or failed")
          if record.get("error") or any(item.get("status") != "passed" for item in record.get("commands", [])):
              raise SystemExit("wallet gate evidence contains a failed command")
          external = root / "external-gates.json"
          if not external.is_file():
              raise SystemExit("external testnet/KMS/backup/soak gate evidence is required")
          external_record = json.loads(external.read_text(encoding="utf-8"))
          if external_record.get("commit_sha") != os.environ["EXPECTED_SHA"] or external_record.get("status") != "passed":
              raise SystemExit("external gate evidence is stale or failed")
          reviewed = external_record.get("reviewed_at")
          if not isinstance(reviewed, str):
              raise SystemExit("external gate evidence reviewer timestamp is missing")
          reviewed_at = __import__("datetime").datetime.fromisoformat(reviewed.replace("Z", "+00:00"))
          if (__import__("datetime").datetime.now(__import__("datetime").timezone.utc) - reviewed_at).total_seconds() > 72 * 3600:
              raise SystemExit("external gate evidence is older than 72 hours")
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match package version {version}")
          PY
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build reproducible wheel
        run: python scripts/build-reproducible-wheel.py --output dist
      - name: Generate dependency SBOM
        run: python -m pip_audit -r requirements.lock -f cyclonedx-json -o dist/noyra-dependencies.cdx.json
      - name: Create release checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Install pinned cosign
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/cosign" \
            | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/cosign"
      - name: Sign release checksums with Sigstore
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS
      - name: Verify release checksum signature
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" verify-blob \
            --certificate dist/SHA256SUMS.pem \
            --signature dist/SHA256SUMS.sig \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*.whl"
      - name: Attest dependency SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: "dist/*.whl"
          sbom-path: "dist/noyra-dependencies.cdx.json"
      - name: Publish signed release bundle
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
