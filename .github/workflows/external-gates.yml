name: external-gates

on:
  workflow_dispatch:
    inputs:
      external_gates_json_base64:
        description: Base64 of the independently reviewed and signed external-gates.json (must contain no secrets)
        required: true
        type: string

permissions: {}

jobs:
  verify-and-publish-evidence:
    environment: external-gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked verification dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Verify signed evidence for this exact release commit
        env:
          EXTERNAL_GATES_BUNDLE_BASE64: ${{ inputs.external_gates_json_base64 }}
          EXTERNAL_GATES_PUBLIC_KEY: ${{ secrets.EXTERNAL_GATES_PUBLIC_KEY }}
        run: >-
          python -m scripts.prepare_external_gates
          --expected-sha "${GITHUB_SHA}"
          --output artifacts/external-gates.json
      - name: Upload verified external gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-gates-${{ github.sha }}
          path: artifacts/external-gates.json
          if-no-files-found: error
          retention-days: 90
