name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ".[dev]"
      - run: python scripts/audit-m41.py --scope targeted --profile smoke
      - run: python -m pytest --cov=noyra --cov-report=term-missing
      - name: Verify Ubuntu installer backup boundary
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          sudo bash tests/shell/test-install-ubuntu-backup-boundary.sh
          sudo bash tests/shell/test-single-disk-storage-contract.sh
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src tests
      - run: python -m pip_audit -r requirements.lock
      - run: python -m pip_audit -r requirements.lock -f cyclonedx-json -o sbom-${{ matrix.os }}-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.os }}-${{ matrix.python-version }}
          path: sbom-*.json

  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned base runtime image
        run: docker build --pull=false --build-arg NOYRA_INSTALL_PROFILE=base --tag noyra:base-ci .
      - name: Build pinned cloud runtime image
        run: docker build --pull=false --build-arg NOYRA_INSTALL_PROFILE=cloud --tag noyra:cloud-ci .

  cloud-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements.lock --requirement requirements-cloud.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -c "import boto3, noyra; assert boto3.__version__ == '1.43.72'"
      - run: python -m pip check
