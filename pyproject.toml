[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "noyra"
version = "0.1.0"
description = "A continuity-first experimental artificial subject runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaxon Grey" }]
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=50,<51",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[project.scripts]
noyra-service = "noyra.service:main"
noyra-desktop = "noyra.desktop:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
cloud = [
  "boto3>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noyra = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
